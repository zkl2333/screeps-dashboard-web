services:
  dashboard:
    build: .
    restart: unless-stopped
    ports:
      - "3200:3000"
    environment:
      SCREEPS_ALLOWED_ORIGINS: https://screeps.com
      DASHBOARD_ADMIN_PASSWORD: ${DASHBOARD_ADMIN_PASSWORD}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
